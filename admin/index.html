<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TWS Admin Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../store.css"></head><body><main class="page" style="max-width:480px;padding-top:70px"><p class="eyebrow">PRIVATE ADMIN</p><h1 class="serif" style="font-size:50px">Welcome back.</h1><div class="summary"><div class="field"><label>Username</label><input id="username" autocomplete="username"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="login" class="btn btn-dark" style="width:100%;margin-top:16px">Login</button><p class="helper">Set ADMIN_USERNAME, ADMIN_PASSWORD and JWT_SECRET in your server environment before using this in production.</p></div><p id="error"></p></main><script>login.onclick=async()=>{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(r.ok)location.href='dashboard.html';else error.textContent=(await r.json()).error||'Login failed'};</script></body></html>
