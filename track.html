<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — The Wallet Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="store.css"></head><body><main class="page" style="max-width:650px"><p class="eyebrow">THE WALLET STUDIO</p><h1 class="serif" style="font-size:48px">Track your order.</h1><div class="field"><label>Order ID</label><input id="order" placeholder="TWS-..."></div><button class="btn btn-dark" id="track" style="width:100%;margin-top:10px">Track Order</button><div id="result" class="section"></div></main><script>const $=id=>document.getElementById(id);const q=new URLSearchParams(location.search).get('order');if(q)$('order').value=q;$('track').onclick=async()=>{const id=$('order').value.trim();if(!id)return;const r=await fetch('/api/orders/'+encodeURIComponent(id));const d=await r.json();if(!r.ok){$('result').innerHTML='<p>Order not found.</p>';return}const steps=[['new','Order placed'],['processing','Processing'],['shipped','Shipped'],['delivered','Delivered']];const current=steps.findIndex(x=>x[0]===d.status);$('result').innerHTML=`<p class="eyebrow">${d.order_no}</p><h2>₹${d.total}</h2>`+steps.map((x,i)=>`<p style="font-weight:${i<=current?700:400}">${i<=current?'✓':'○'} ${x[1]}</p>`).join('')+`<p>Payment: ${d.payment_status}</p>`};if(q)$('track').click();</script></body></html>
